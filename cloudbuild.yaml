# ==============================================================================
# Google Cloud Build - Unified CI/CD Pipeline
# Source Repository: https://github.com/EaseMyWorld/gh-wm-coach
# Deploys Backend & Frontend to Cloud Run with Direct VPC Egress to AlloyDB
# ==============================================================================

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: wm-coach-repo
  _VPC_NETWORK: wm-coach-vpc
  _VPC_SUBNET: wm-coach-subnet
  _ALLOYDB_IP: "10.10.0.3" # Placeholder: Set to your AlloyDB Primary Instance Private IP
  _GEMINI_KEY_SECRET: "gemini-api-key"
  _DB_PASSWORD_SECRET: "alloydb-password"
  _BACKEND_SERVICE_NAME: "wm-coach-backend"
  _FRONTEND_SERVICE_NAME: "wm-coach-frontend"
  _BACKEND_SA: "wm-coach-backend-sa"
  _FRONTEND_SA: "wm-coach-frontend-sa"

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Build Backend Container Image
  # ----------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:latest"
      - "./backend"

  # ----------------------------------------------------------------------------
  # Step 2: Push Backend Container Image to Artifact Registry
  # ----------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend"

  # ----------------------------------------------------------------------------
  # Step 3: Deploy Backend Service to Cloud Run (with Direct VPC Egress & Secrets)
  # ----------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --network=${_VPC_NETWORK} \
          --subnet=${_VPC_SUBNET} \
          --vpc-egress=private-ranges-only \
          --set-env-vars=DB_HOST=${_ALLOYDB_IP},DB_PORT=5432,DB_NAME=financial_coach,DB_USER=postgres,GEMINI_MODEL=gemini-2.0-flash \
          --set-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,GEMINI_API_KEY=${_GEMINI_KEY_SECRET}:latest \
          --service-account=${_BACKEND_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10

  # ----------------------------------------------------------------------------
  # Step 4: Resolve Backend Cloud Run Public URL for Frontend Integration
  # ----------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "get-backend-url"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Resolved Backend Service URL: $$BACKEND_URL"
        echo "$$BACKEND_URL" > /workspace/backend_url.txt

  # ----------------------------------------------------------------------------
  # Step 5: Build Frontend Container Image (Injecting Backend URL)
  # ----------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg BACKEND_URL=$$BACKEND_URL \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend:latest \
          ./frontend

  # ----------------------------------------------------------------------------
  # Step 6: Push Frontend Container Image to Artifact Registry
  # ----------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend"

  # ----------------------------------------------------------------------------
  # Step 7: Deploy Frontend Service to Cloud Run (with Direct VPC Egress)
  # ----------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        gcloud run deploy ${_FRONTEND_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --network=${_VPC_NETWORK} \
          --subnet=${_VPC_SUBNET} \
          --vpc-egress=private-ranges-only \
          --set-env-vars=BACKEND_URL=$$BACKEND_URL,NODE_ENV=production \
          --service-account=${_FRONTEND_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:latest"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/frontend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
