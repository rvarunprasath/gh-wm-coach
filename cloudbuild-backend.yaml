# ==============================================================================
# Google Cloud Build - Backend CI/CD Pipeline
# Triggered on changes to backend/** in https://github.com/EaseMyWorld/gh-wm-coach
# ==============================================================================

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: wm-coach-repo
  _VPC_NETWORK: wm-coach-vpc
  _VPC_SUBNET: wm-coach-subnet
  _ALLOYDB_IP: "10.10.0.3" # Placeholder: Set to your AlloyDB Primary Instance Private IP
  _GEMINI_KEY_SECRET: "gemini-api-key"
  _DB_PASSWORD_SECRET: "alloydb-password"
  _BACKEND_SERVICE_NAME: "wm-coach-backend"
  _BACKEND_SA: "wm-coach-backend-sa"

steps:
  # 1. Build Backend Container Image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:latest"
      - "./backend"

  # 2. Push Backend Container Image
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend"

  # 3. Deploy Backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --network=${_VPC_NETWORK} \
          --subnet=${_VPC_SUBNET} \
          --vpc-egress=private-ranges-only \
          --set-env-vars=DB_HOST=${_ALLOYDB_IP},DB_PORT=5432,DB_NAME=financial_coach,DB_USER=postgres,GEMINI_MODEL=gemini-2.0-flash \
          --set-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,GEMINI_API_KEY=${_GEMINI_KEY_SECRET}:latest \
          --service-account=${_BACKEND_SA}@$PROJECT_ID.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
